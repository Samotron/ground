[workspace]
resolver = "3"
members = ["crates/gm-core", "crates/gm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/samotron/ground"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "functions"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
tiny_http = "0.12"
